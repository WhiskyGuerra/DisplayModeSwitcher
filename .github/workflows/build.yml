name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Release-Build
        run: dotnet build DisplayModeSwitcher.sln --configuration Release

      - name: Konsolentests
        run: dotnet run --project DisplayModeSwitcher.Tests --configuration Release --no-build
